name: factory-forgejo
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17.0.1
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__ROOT_URL: http://${FACTORY_BIND:-127.0.0.1}:3000/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__webhook__ALLOWED_HOST_LIST: "*"
    volumes:
      - ./data:/data
    ports:
      - ${FACTORY_BIND:-127.0.0.1}:3000:3000
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [factory-core]
networks:
  factory-core:
    external: true
