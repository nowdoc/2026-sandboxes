events {}
http {
  limit_req_zone $binary_remote_addr zone=task:1m rate=10r/s;
  # Task API: uzka read-only cesta ke kontextu ulohy, identita je TASK_TOKEN.
  server {
    listen 4001;
    client_max_body_size 64k;
    location / { return 403 "not allowed\n"; }
    # Git smart HTTP na staging. Orchestrator overi TASK_TOKEN a pusti jen repo dane ulohy.
    location ^~ /git/ {
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_read_timeout 900s;
      proxy_pass http://172.18.0.1:9001;
    }
    location ~ ^/task/(comments|ci|slack|reply)$ {
      limit_req zone=task burst=20 nodelay;
      proxy_pass http://172.18.0.1:9001;
    }
  }
  server {
    listen 4000;
    client_max_body_size 50m;
    # Jen LLM volani. Admin API LiteLLM (/key/*, /user/*) ze sandboxu neni dostupne.
    location / { return 403 "not allowed\n"; }
    location ~ ^/v1/(chat/completions|messages|messages/count_tokens|responses|models)$ {
      proxy_pass http://litellm:4000;
      proxy_buffering off;
      proxy_read_timeout 600s;
    }
  }
}
