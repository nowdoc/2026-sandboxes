name: fixture
services:
  dns:
    image: alpine:3.22
    command: sh -c 'apk add -q dnsmasq && exec dnsmasq -k --address=/cz.test/172.30.0.2'
    networks:
      app: {ipv4_address: 172.30.0.2}
  web:
    image: busybox:1.37
    command: sh -c 'mkdir -p /www && echo web > /www/index.html && exec httpd -f -p 8080 -h /www'
    dns: [172.30.0.2]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 2s
      retries: 30
    networks: [app]
    depends_on: [dns]
