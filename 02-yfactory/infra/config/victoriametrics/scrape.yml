global: { scrape_interval: 30s }
scrape_configs:
  - { job_name: victoriametrics, static_configs: [{ targets: ["localhost:8428"] }] }
  - { job_name: victorialogs, static_configs: [{ targets: ["victorialogs:9428"] }] }
  - { job_name: grafana, static_configs: [{ targets: ["grafana:3000"] }] }
  - { job_name: yfactory, static_configs: [{ targets: ["yfactory:8080"] }] }
  - { job_name: sandbox, static_configs: [{ targets: ["sandbox:7000"] }] }
  - { job_name: cadvisor, static_configs: [{ targets: ["cadvisor:8080"] }] }
