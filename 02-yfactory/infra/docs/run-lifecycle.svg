<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 512" width="1160" height="512" role="img" aria-label="Run lifecycle: steps 1 to 3 and 7 to 9 run in the trusted orchestrator, steps 4 to 6 inside the untrusted microVM">
<style>svg{font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
